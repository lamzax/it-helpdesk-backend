<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8" />
<title>IT Helpdesk — Admin panelis</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

<div id="loginScreen">
  <h1>IT Helpdesk</h1>
  <p>Admin panelis</p>
  <input id="loginIdentifier" type="text" placeholder="E-pasts vai telefona numurs" />
  <button class="btn btn-primary" onclick="doLogin()">Ielogoties</button>
  <p class="muted" id="loginError"></p>
  <p class="muted">Pieteikties var tikai jau reģistrēts lietotājs. Ja jūsu konts vēl nav izveidots, pieprasījums tiks nosūtīts administratoram.</p>
</div>

<div id="app">
  <div class="layout">
    <aside id="sidebar">
      <div class="sidebar-logo">
        <img src="https://viss.lv/dati/otanku_dzirnavnieks_sia/logo_otanku_dzirnavnieks_sia.jpg" alt="OtankiMill" />
      </div>
      <nav id="mainNav"></nav>
    </aside>
    <div class="main-area">
      <header class="top-bar">
        <div style="position:relative;">
          <input type="text" id="globalSearchInput" placeholder="🔍 Meklēt visur..." oninput="handleGlobalSearch()" />
          <div id="globalSearchResults" class="global-search-results" style="display:none;"></div>
        </div>
        <div class="user-wrap">
          <span id="whoAmI"></span>
          <button class="btn btn-outline btn-sm" onclick="logout()">Iziet</button>
        </div>
      </header>
      <main id="mainContent"></main>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalContent"></div></div>

<script src="app.js"></script>
</body>
</html>
